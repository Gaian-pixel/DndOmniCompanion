name: CI Tests & Static Checks

on:
  push:
    branches:
      - main
      - 'dev/**'
      - 'feat/**'
  pull_request:

jobs:
  test:
    name: Syntax, Static Checks & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Linux GUI & Audio libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb python3-tk libportaudio2 libsndfile1 libasound2-dev

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyflakes

      - name: Run unified verification gate (py_compile, pyflakes, isolated unittest suite)
        env:
          DND_MOCK_AUDIO: '1'
        run: |
          xvfb-run -a python -X utf8 scripts/autonomous_dev_loop.py --verify
