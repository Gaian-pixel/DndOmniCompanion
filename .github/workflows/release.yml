name: Release Packages

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Packages (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk libportaudio2 libsndfile1 libasound2-dev

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Build Script
        env:
          RELEASE_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || 'v0.1.0-alpha' }}
        run: |
          python build_release.py

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-package-${{ matrix.os }}
          path: |
            dist/*.zip
            dist/*.tar.gz
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-package-*
          path: release-assets
          merge-multiple: true

      - name: List downloaded release assets
        run: |
          ls -la release-assets

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'v0.1.0-alpha' }}
          name: Release ${{ github.ref_type == 'tag' && github.ref_name || 'v0.1.0-alpha' }}
          draft: false
          prerelease: true
          generate_release_notes: true
          body: |
            ### 📦 Download Pre-Built Executables / Eseguibili Standalone
            - **Windows (x64)**: Download `DndOmniCompanion-*-win64.zip`, extract and run `DndOmniCompanion.exe`.
            - **Linux (x64)**: Download `DndOmniCompanion-*-linux-x64.tar.gz`, extract and run `./run.sh` (or `./DndOmniCompanion`).
          files: |
            release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
